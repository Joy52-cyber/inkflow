# Force a clean, complete install on Railway to dodge npm's optional-deps bug
# (npm/cli#4828), which drops platform-native binaries (@tailwindcss/oxide,
# rollup, sharp) on Linux and causes "Cannot find native binding" at build time.
# rm -rf node_modules busts any cached/stale layer; --include=dev,optional
# guarantees the build tooling and the native binaries are installed.
[phases.install]
cmds = ["rm -rf node_modules package-lock.json", "npm install --include=dev --include=optional --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]
